<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%" aria-hidden="true">
  <circle cx="200" cy="200" r="180" fill="none" stroke="rgba(138,47,20,0.35)" stroke-width="2" />
  <circle cx="200" cy="200" r="180" fill="none" stroke="rgba(201,138,28,0.45)" stroke-width="1.5" stroke-dasharray="150" stroke-dashoffset="350">
    <animate attributeName="stroke-dashoffset" values="350;-150" dur="8s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.2;0.7;0.2" dur="4s" repeatCount="indefinite" />
  </circle>
  <circle cx="200" cy="200" r="120" fill="none" stroke="rgba(138,47,20,0.3)" stroke-width="1" stroke-dasharray="80" stroke-dashoffset="200">
    <animate attributeName="stroke-dashoffset" values="200;-80" dur="6s" repeatCount="indefinite" />
  </circle>
</svg>
